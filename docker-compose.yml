# ==============================================================================
# FaceCheck Banking KYC Biometrics - Local Production-Grade Docker Stack
# Strict Requirements:
# - Bind to 127.0.0.1 ONLY (never 0.0.0.0)
# - No database port published to host by default
# - Dual isolated networks (internal vs frontend)
# - Pinned image versions, non-root users, cap_drop: ALL, no-new-privileges
# - Healthchecks and resource limits on every service
# ==============================================================================

networks:
  db_isolated:
    driver: bridge
    internal: true # Air-gapped database network; strictly no outbound internet, postgres cannot contact any external host
  backend:
    driver: bridge # Secure internal backend network with outbound internet egress for ML training stream & Ollama
  frontend:
    driver: bridge # Ingress network for API client and Read-Only Monitor Web

volumes:
  postgres_data:
  ollama_data:
  model_store:
  audit_worm_store:

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 15.6 Enterprise Biometric Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15.6-alpine
    container_name: facecheck_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - FOWNER
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facecheck_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database superuser password required}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Migrator password required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?App password required}
      DB_ML_WORKER_PASSWORD: ${DB_ML_WORKER_PASSWORD:?ML worker password required}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?Readonly password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - db_isolated
    # Database port is not published to host by default (internal access only).
    # To debug locally, uncomment the line below:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-facecheck_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. Local Ollama LLM Service (Offline Explainer)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.5.7
    container_name: facecheck_ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 3. FaceCheck Backend REST API (FastAPI)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: facecheck-api:1.0.0
    container_name: facecheck_api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      FACECHECK_DB_ENGINE: postgresql
      FACECHECK_DB_HOST: postgres
      FACECHECK_DB_PORT: 5432
      FACECHECK_DB_NAME: ${POSTGRES_DB:-facecheck_db}
      FACECHECK_DB_USER: facecheck_app
      FACECHECK_DB_PASSWORD: ${DB_APP_PASSWORD}
      FACECHECK_SERVER_HOST: 0.0.0.0
      FACECHECK_SERVER_PORT: 8000
      FACECHECK_API_KEY: ${FACECHECK_API_KEY}
      FACECHECK_ENCRYPTION_KEY: ${ENCRYPTION_MASTER_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      CLOUD_LLM_ENABLED: "false"
      DATA_RESIDENCY_APPROVED: "false"
    volumes:
      - audit_worm_store:/app/storage/worm_anchors:rw
    networks:
      - db_isolated
      - backend
      - frontend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 4. FaceCheck ML Training Worker
  # ----------------------------------------------------------------------------
  ml-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml_worker
    image: facecheck-ml-worker:1.0.0
    container_name: facecheck_ml_worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10002:10002"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      FACECHECK_DB_ENGINE: postgresql
      FACECHECK_DB_HOST: postgres
      FACECHECK_DB_PORT: 5432
      FACECHECK_DB_NAME: ${POSTGRES_DB:-facecheck_db}
      FACECHECK_DB_USER: facecheck_ml_worker
      FACECHECK_DB_PASSWORD: ${DB_ML_WORKER_PASSWORD}
      FACECHECK_DAEMON_ENABLED: "true"
      FACECHECK_TRAINING_ENABLED: "true"
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-llama3.2}
      CLOUD_LLM_ENABLED: "false"
      DATA_RESIDENCY_APPROVED: "false"
    volumes:
      - model_store:/app/models/trained:rw
    networks:
      - db_isolated
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/worker_heartbeat'; sys.exit(0 if (os.path.exists(p) and (time.time() - os.path.getmtime(p)) < 120) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. Read-Only Monitoring Dashboard Web Service (GET Only)
  # ----------------------------------------------------------------------------
  monitor-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    image: facecheck-monitor-web:1.0.0
    container_name: facecheck_monitor_web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32M,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32M,mode=1777
      - /var/run:rw,noexec,nosuid,size=16M,mode=1777
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend # Connected to frontend only; zero direct database network path
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
