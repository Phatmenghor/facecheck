# ==============================================================================
# FaceCheck Monitoring Dashboard - Hardened Read-Only Nginx Configuration
# Strictly GET / HEAD only - All mutation verbs (POST, PUT, DELETE, PATCH) blocked
# ==============================================================================

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /tmp/access.log;
    error_log  /tmp/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com;" always;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        index index.html;

        # Health endpoint
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status": "UP", "service": "facecheck-monitor-web", "mode": "read-only"}';
        }

        # Enforce Strictly Read-Only: Reject all non-GET/HEAD methods with HTTP 405
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 '{"error": "Method Not Allowed - FaceCheck Monitor is Strictly Read-Only"}';
        }

        # Static Dashboard Files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Read-Only API Proxy to backend api service
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }
    }
}
